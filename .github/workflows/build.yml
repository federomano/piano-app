name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # "true" solo si ya se cargaron los secretos de la clave de firma.
      TIENE_CLAVE: ${{ secrets.PIANO_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Preparar la clave de firma
        if: env.TIENE_CLAVE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.PIANO_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/piano.jks"
          echo "PIANO_KEYSTORE_FILE=$RUNNER_TEMP/piano.jks" >> "$GITHUB_ENV"

      - name: Compilar
        env:
          PIANO_KEYSTORE_PASSWORD: ${{ secrets.PIANO_KEYSTORE_PASSWORD }}
          PIANO_KEY_ALIAS: ${{ secrets.PIANO_KEY_ALIAS }}
          PIANO_KEY_PASSWORD: ${{ secrets.PIANO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Aviso si falta la clave de firma
        if: env.TIENE_CLAVE != 'true'
        run: |
          echo "::warning title=Falta la clave de firma::El APK compiló bien pero no se publicó porque todavía no están cargados los secretos de firma. Ver docs/INSTALAR.md."

      - name: Publicar el APK
        if: env.TIENE_CLAVE == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.1.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "piano-app-${VERSION}.apk"
          NOTAS="$(git log -1 --pretty=%s)"
          gh release create "v${VERSION}" "piano-app-${VERSION}.apk" \
            --title "Versión ${VERSION}" \
            --notes "${NOTAS}"
